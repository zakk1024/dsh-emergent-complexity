<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" role="img" aria-label="Nine-step loop: combinatorial supply then selective retention">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080C12"/>
      <stop offset="1" stop-color="#0A1119"/>
    </linearGradient>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FFB454"/>
    </marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2CE0C2"/>
    </marker>
  </defs>
  <rect width="1200" height="940" fill="url(#bgL)"/>

  <text x="48" y="52" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#E8F0F7">THE LOOP — nine steps per round, no step may be skipped</text>
  <text x="48" y="76" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#8496A8">Stage A supplies candidates by construction. Stage B retains only verified novelty. State lives on disk, never in context.</text>

  <!-- stage A -->
  <rect x="48" y="100" width="1104" height="250" rx="10" fill="#0C141E" stroke="#1B2A3B"/>
  <text x="64" y="126" font-family="Menlo, Consolas, monospace" font-size="11" fill="#2CE0C2" letter-spacing="2">STAGE A · COMBINATORIAL SUPPLY</text>

  <g font-family="Menlo, Consolas, monospace">
    <!-- card 1 -->
    <rect x="64" y="142" width="196" height="188" rx="8" fill="#101A26" stroke="#22364A"/>
    <circle cx="84" cy="164" r="13" fill="#13202E" stroke="#2CE0C2"/>
    <text x="84" y="168" font-size="11" fill="#2CE0C2" text-anchor="middle">1</text>
    <text x="106" y="169" font-size="12" font-weight="700" fill="#E8F0F7">READ STATE</text>
    <text x="76" y="196" font-size="10" fill="#9FB2C4">grid.md only.</text>
    <text x="76" y="212" font-size="10" fill="#9FB2C4">Full ideas.jsonl</text>
    <text x="76" y="228" font-size="10" fill="#9FB2C4">is forbidden.</text>
    <rect x="76" y="296" width="66" height="22" rx="4" fill="#12202C" stroke="#24404F"/>
    <text x="86" y="311" font-size="9" fill="#7FE7D4">[rule]</text>

    <!-- card 2 -->
    <rect x="276" y="142" width="196" height="188" rx="8" fill="#101A26" stroke="#22364A"/>
    <circle cx="296" cy="164" r="13" fill="#13202E" stroke="#FFB454"/>
    <text x="296" y="168" font-size="11" fill="#FFB454" text-anchor="middle">2</text>
    <text x="318" y="169" font-size="12" font-weight="700" fill="#E8F0F7">SAMPLE PAIR</text>
    <text x="288" y="196" font-size="10" fill="#9FB2C4">2–3 elements, one</text>
    <text x="288" y="212" font-size="10" fill="#9FB2C4">variable each, 1–2</text>
    <text x="288" y="228" font-size="10" fill="#9FB2C4">operators. Pairs ≥2</text>
    <text x="288" y="244" font-size="10" fill="#9FB2C4">axes apart first.</text>
    <rect x="288" y="296" width="66" height="22" rx="4" fill="#2A2114" stroke="#5A4520"/>
    <text x="298" y="311" font-size="9" fill="#FFC97A">[proxy]</text>

    <!-- card 3 -->
    <rect x="488" y="142" width="196" height="188" rx="8" fill="#101A26" stroke="#22364A"/>
    <circle cx="508" cy="164" r="13" fill="#13202E" stroke="#2CE0C2"/>
    <text x="508" y="168" font-size="11" fill="#2CE0C2" text-anchor="middle">3</text>
    <text x="530" y="169" font-size="12" font-weight="700" fill="#E8F0F7">GENERATE</text>
    <text x="500" y="196" font-size="10" fill="#9FB2C4">Output only what</text>
    <text x="500" y="212" font-size="10" fill="#9FB2C4">the expression tree</text>
    <text x="500" y="228" font-size="10" fill="#9FB2C4">derives. No free</text>
    <text x="500" y="244" font-size="10" fill="#9FB2C4">inspiration.</text>
    <rect x="500" y="296" width="66" height="22" rx="4" fill="#12202C" stroke="#24404F"/>
    <text x="510" y="311" font-size="9" fill="#7FE7D4">[rule]</text>

    <!-- card 4 -->
    <rect x="700" y="142" width="196" height="188" rx="8" fill="#101A26" stroke="#22364A"/>
    <circle cx="720" cy="164" r="13" fill="#13202E" stroke="#FFB454"/>
    <text x="720" y="168" font-size="11" fill="#FFB454" text-anchor="middle">4</text>
    <text x="742" y="169" font-size="12" font-weight="700" fill="#E8F0F7">MUTATION TIERS</text>
    <text x="712" y="196" font-size="10" fill="#9FB2C4">light : mid : heavy</text>
    <text x="712" y="212" font-size="10" fill="#9FB2C4">≈ 5 : 3 : 2, checked</text>
    <text x="712" y="228" font-size="10" fill="#9FB2C4">by counting operators</text>
    <text x="712" y="244" font-size="10" fill="#9FB2C4">in code, not printed.</text>
    <rect x="712" y="296" width="42" height="22" rx="4" fill="#2A2114" stroke="#5A4520"/>
    <text x="722" y="311" font-size="9" fill="#FFC97A">[H]</text>

    <!-- card 5 -->
    <rect x="912" y="142" width="196" height="188" rx="8" fill="#101A26" stroke="#22364A"/>
    <circle cx="932" cy="164" r="13" fill="#13202E" stroke="#2CE0C2"/>
    <text x="932" y="168" font-size="11" fill="#2CE0C2" text-anchor="middle">5</text>
    <text x="954" y="169" font-size="12" font-weight="700" fill="#E8F0F7">RESET ×1</text>
    <text x="924" y="196" font-size="10" fill="#9FB2C4">Exactly one</text>
    <text x="924" y="212" font-size="10" fill="#9FB2C4">candidate rebuilt</text>
    <text x="924" y="228" font-size="10" fill="#9FB2C4">from elements that</text>
    <text x="924" y="244" font-size="10" fill="#9FB2C4">never co-occurred.</text>
    <rect x="924" y="296" width="66" height="22" rx="4" fill="#12202C" stroke="#24404F"/>
    <text x="934" y="311" font-size="9" fill="#7FE7D4">[rule]</text>
  </g>

  <!-- stage B -->
  <rect x="48" y="368" width="1104" height="236" rx="10" fill="#0C141E" stroke="#1B2A3B"/>
  <text x="64" y="394" font-family="Menlo, Consolas, monospace" font-size="11" fill="#B08CFF" letter-spacing="2">STAGE B · SELECTIVE RETENTION</text>

  <g font-family="Menlo, Consolas, monospace">
    <rect x="64" y="410" width="248" height="174" rx="8" fill="#101A26" stroke="#22364A"/>
    <circle cx="84" cy="432" r="13" fill="#13202E" stroke="#B08CFF"/>
    <text x="84" y="436" font-size="11" fill="#B08CFF" text-anchor="middle">6</text>
    <text x="106" y="437" font-size="12" font-weight="700" fill="#E8F0F7">LOCATE CELL</text>
    <text x="76" y="464" font-size="10" fill="#9FB2C4">Tag every candidate with</text>
    <text x="76" y="480" font-size="10" fill="#9FB2C4">(scale, mechanism, context).</text>
    <text x="76" y="496" font-size="10" fill="#9FB2C4">Occupancy is computed by</text>
    <text x="76" y="512" font-size="10" fill="#9FB2C4">script, never by eye.</text>
    <rect x="76" y="548" width="66" height="22" rx="4" fill="#12202C" stroke="#24404F"/>
    <text x="86" y="563" font-size="9" fill="#7FE7D4">[rule]</text>

    <rect x="328" y="410" width="248" height="174" rx="8" fill="#101A26" stroke="#22364A"/>
    <circle cx="348" cy="432" r="13" fill="#13202E" stroke="#FFB454"/>
    <text x="348" y="436" font-size="11" fill="#FFB454" text-anchor="middle">7</text>
    <text x="370" y="437" font-size="12" font-weight="700" fill="#E8F0F7">HONEST COUNT</text>
    <text x="340" y="464" font-size="10" fill="#9FB2C4">Duplication = 1 − truly</text>
    <text x="340" y="480" font-size="10" fill="#9FB2C4">distinct / candidates.</text>
    <text x="340" y="496" font-size="10" fill="#9FB2C4">One-directional correction:</text>
    <text x="340" y="512" font-size="10" fill="#9FB2C4">over-count duplicates.</text>
    <rect x="340" y="548" width="66" height="22" rx="4" fill="#2A2114" stroke="#5A4520"/>
    <text x="350" y="563" font-size="9" fill="#FFC97A">[proxy]</text>

    <rect x="592" y="410" width="248" height="174" rx="8" fill="#101A26" stroke="#22364A"/>
    <circle cx="612" cy="432" r="13" fill="#13202E" stroke="#B08CFF"/>
    <text x="612" y="436" font-size="11" fill="#B08CFF" text-anchor="middle">8</text>
    <text x="634" y="437" font-size="12" font-weight="700" fill="#E8F0F7">SELECT</text>
    <text x="604" y="464" font-size="10" fill="#9FB2C4">Phase-dependent. Gate runs</text>
    <text x="604" y="480" font-size="10" fill="#9FB2C4">in a separate pass that sees</text>
    <text x="604" y="496" font-size="10" fill="#9FB2C4">only grid.md — never the</text>
    <text x="604" y="512" font-size="10" fill="#9FB2C4">generation transcript.</text>
    <rect x="604" y="548" width="66" height="22" rx="4" fill="#2A2114" stroke="#5A4520"/>
    <text x="614" y="563" font-size="9" fill="#FFC97A">[proxy]</text>

    <rect x="856" y="410" width="252" height="174" rx="8" fill="#101A26" stroke="#22364A"/>
    <circle cx="876" cy="432" r="13" fill="#13202E" stroke="#2CE0C2"/>
    <text x="876" y="436" font-size="11" fill="#2CE0C2" text-anchor="middle">9</text>
    <text x="898" y="437" font-size="12" font-weight="700" fill="#E8F0F7">WRITE</text>
    <text x="868" y="464" font-size="10" fill="#9FB2C4">Append to ideas.jsonl,</text>
    <text x="868" y="480" font-size="10" fill="#9FB2C4">rewrite grid.md, log the</text>
    <text x="868" y="496" font-size="10" fill="#9FB2C4">round. History rows are</text>
    <text x="868" y="512" font-size="10" fill="#9FB2C4">never rewritten.</text>
    <rect x="868" y="548" width="66" height="22" rx="4" fill="#12202C" stroke="#24404F"/>
    <text x="878" y="563" font-size="9" fill="#7FE7D4">[rule]</text>
  </g>

  <!-- archive -->
  <rect x="48" y="620" width="1104" height="150" rx="10" fill="#0B1620" stroke="#1E3A4A"/>
  <text x="64" y="646" font-family="Menlo, Consolas, monospace" font-size="11" fill="#5AA9FF" letter-spacing="2">PERSISTENT STATE · ei-archive/</text>
  <g font-family="Menlo, Consolas, monospace">
    <rect x="64" y="660" width="330" height="94" rx="8" fill="#0F1B26" stroke="#24405A"/>
    <text x="80" y="684" font-size="11" fill="#E8F0F7">grid.md</text>
    <text x="80" y="702" font-size="10" fill="#8FA2B4">The only state the model may read.</text>
    <text x="80" y="718" font-size="10" fill="#8FA2B4">Rows carry par + ops for cross-round</text>
    <text x="80" y="734" font-size="10" fill="#8FA2B4">cluster checks.</text>

    <rect x="410" y="660" width="330" height="94" rx="8" fill="#0F1B26" stroke="#24405A"/>
    <text x="426" y="684" font-size="11" fill="#E8F0F7">ideas.jsonl</text>
    <text x="426" y="702" font-size="10" fill="#8FA2B4">Append-only truth source.</text>
    <text x="426" y="718" font-size="10" fill="#8FA2B4">Re-runs must not touch existing</text>
    <text x="426" y="734" font-size="10" fill="#8FA2B4">rows — verified by dump diff.</text>

    <rect x="756" y="660" width="380" height="94" rx="8" fill="#0F1B26" stroke="#24405A"/>
    <text x="772" y="684" font-size="11" fill="#E8F0F7">ei-runs/run-N.md</text>
    <text x="772" y="702" font-size="10" fill="#8FA2B4">Audit trail: round, phase, duplication</text>
    <text x="772" y="718" font-size="10" fill="#8FA2B4">rate, both gate verdicts, selection</text>
    <text x="772" y="734" font-size="10" fill="#8FA2B4">reasons, parameter version.</text>
  </g>

  <!-- feedback arrow -->
  <path d="M 48 700 H 24 V 128 H 44" fill="none" stroke="#FFB454" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowA)" opacity="0.85"/>
  <text transform="translate(18,520) rotate(-90)" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#FFB454">NEXT ROUND · grid.md only · nothing is pruned</text>

  <!-- legend -->
  <g font-family="Menlo, Consolas, monospace">
    <rect x="48" y="792" width="1104" height="118" rx="10" fill="#0A1018" stroke="#1A2734"/>
    <text x="64" y="816" font-size="11" fill="#8496A8" letter-spacing="1.6">LABELS USED IN THIS REPO — every number carries one of these</text>
    <rect x="64" y="830" width="330" height="62" rx="8" fill="#0E1A26" stroke="#24404F"/>
    <text x="80" y="852" font-size="10" fill="#7FE7D4">[實算] measured</text>
    <text x="80" y="870" font-size="9.5" fill="#8FA2B4">Computed from real output, reproducible.</text>
    <text x="80" y="884" font-size="9.5" fill="#8FA2B4">None of these exist yet in v1 — see README.</text>

    <rect x="410" y="830" width="330" height="62" rx="8" fill="#0E1A26" stroke="#5A4520"/>
    <text x="426" y="852" font-size="10" fill="#FFC97A">[代理] proxy</text>
    <text x="426" y="870" font-size="9.5" fill="#8FA2B4">An LLM heuristic standing in for a real</text>
    <text x="426" y="884" font-size="9.5" fill="#8FA2B4">distance metric. Declared, not hidden.</text>

    <rect x="756" y="830" width="380" height="62" rx="8" fill="#0E1A26" stroke="#5A4520"/>
    <text x="772" y="852" font-size="10" fill="#FFC97A">[H] hypothesis</text>
    <text x="772" y="870" font-size="9.5" fill="#8FA2B4">An untuned starting value. It may only change</text>
    <text x="772" y="884" font-size="9.5" fill="#8FA2B4">with a logged parameter version, one at a time.</text>
  </g>
</svg>
