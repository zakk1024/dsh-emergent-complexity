<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Provenance trace from elements to candidate">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080C12"/>
      <stop offset="1" stop-color="#0A1119"/>
    </linearGradient>
    <marker id="arrC2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5AA9FF"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="url(#bgT)"/>

  <text x="48" y="52" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="20" font-weight="700" fill="#E8F0F7">TRACE — element × variable × function × lineage</text>
  <text x="48" y="76" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="11.5" fill="#8496A8">If any link in this chain is missing, the idea does not count. A pretty sentence with no ancestry is an opinion.</text>

  <g font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace">
    <rect x="64" y="110" width="250" height="158" rx="8" fill="#101A26" stroke="#22364A"/>
    <text x="80" y="134" font-size="10" fill="#5AA9FF" letter-spacing="1.6">SOURCE ELEMENTS</text>
    <text x="80" y="160" font-size="10" fill="#C6D4E1">E07 水合鹽</text>
    <text x="80" y="176" font-size="9" fill="#8FA2B4">variable · 脫水溫度</text>
    <text x="80" y="200" font-size="10" fill="#C6D4E1">E11 相變材料</text>
    <text x="80" y="216" font-size="9" fill="#8FA2B4">variable · 相態</text>
    <text x="80" y="240" font-size="10" fill="#C6D4E1">E02 水</text>
    <text x="80" y="256" font-size="9" fill="#8FA2B4">variable · 溶劑</text>

    <rect x="356" y="110" width="196" height="158" rx="8" fill="#101A26" stroke="#22364A"/>
    <text x="372" y="134" font-size="10" fill="#5AA9FF" letter-spacing="1.6">OPERATOR</text>
    <text x="372" y="160" font-size="10" fill="#C6D4E1">invert</text>
    <text x="372" y="176" font-size="10" fill="#C6D4E1">substitute</text>
    <text x="372" y="202" font-size="9" fill="#8FA2B4">tree ·</text>
    <text x="372" y="218" font-size="9" fill="#8FA2B4">invert(E07 ▸ E11)</text>
    <text x="372" y="242" font-size="9" fill="#FFC97A">tier · heavy</text>

    <rect x="594" y="110" width="176" height="158" rx="8" fill="#101A26" stroke="#22364A"/>
    <text x="610" y="134" font-size="10" fill="#5AA9FF" letter-spacing="1.6">PARENT</text>
    <text x="610" y="160" font-size="10" fill="#C6D4E1">I2-11</text>
    <text x="610" y="176" font-size="9" fill="#8FA2B4">lineage ref</text>
    <text x="610" y="200" font-size="9" fill="#8FA2B4">round 2 · kept</text>

    <rect x="812" y="110" width="312" height="158" rx="8" fill="#0F2230" stroke="#2CE0C2"/>
    <text x="828" y="134" font-size="10" fill="#2CE0C2" letter-spacing="1.6">NEW CANDIDATE · I3-04</text>
    <text x="828" y="158" font-size="9.5" fill="#C6D4E1">把脫水溫度當成觸發器，</text>
    <text x="828" y="174" font-size="9.5" fill="#C6D4E1">而不是材料常數。</text>
    <text x="828" y="198" font-size="9" fill="#8FA2B4">descriptor · 元件 / 相變 / 建築</text>
    <text x="828" y="214" font-size="9" fill="#7FE7D4">novelty_src · empty-cell</text>
    <text x="828" y="238" font-size="9" fill="#FFC97A">gate · novelty pass · critic 2/3</text>
    <text x="828" y="254" font-size="9" fill="#8FA2B4">status · kept · usefulness null</text>
  </g>

  <path d="M 314 189 H 352" fill="none" stroke="#5AA9FF" stroke-width="1.6" marker-end="url(#arrC2)"/>
  <path d="M 552 189 H 590" fill="none" stroke="#5AA9FF" stroke-width="1.6" marker-end="url(#arrC2)"/>
  <path d="M 770 189 H 808" fill="none" stroke="#5AA9FF" stroke-width="1.6" marker-end="url(#arrC2)"/>

  <!-- json -->
  <rect x="48" y="300" width="1104" height="300" rx="10" fill="#0B141C" stroke="#1B2A3B"/>
  <text x="64" y="326" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="11" fill="#2CE0C2" letter-spacing="1.6">TRACE RECORD · ideas.jsonl · append-only</text>
  <g font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="10">
    <text x="80" y="352" fill="#5C6E80">{</text>
    <text x="96" y="372" fill="#7FE7D4">"id"</text><text x="140" y="372" fill="#8496A8">: </text><text x="156" y="372" fill="#FFC97A">"I3-04"</text><text x="212" y="372" fill="#8496A8">,</text>
    <text x="96" y="390" fill="#7FE7D4">"round"</text><text x="176" y="390" fill="#8496A8">: </text><text x="192" y="390" fill="#FFC97A">3</text><text x="204" y="390" fill="#8496A8">,</text>
    <text x="96" y="408" fill="#7FE7D4">"phase"</text><text x="176" y="408" fill="#8496A8">: </text><text x="192" y="408" fill="#FFC97A">"φ2"</text><text x="228" y="408" fill="#8496A8">,</text>
    <text x="96" y="426" fill="#7FE7D4">"claim"</text><text x="176" y="426" fill="#8496A8">: </text><text x="192" y="426" fill="#FFC97A">"把水合鹽的脫水溫度當成觸發器，而不是材料常數。"</text><text x="628" y="426" fill="#8496A8">,</text>
    <text x="96" y="444" fill="#7FE7D4">"elements"</text><text x="208" y="444" fill="#8496A8">: [</text><text x="224" y="444" fill="#FFC97A">"E07"</text><text x="264" y="444" fill="#8496A8">, </text><text x="272" y="444" fill="#FFC97A">"E11"</text><text x="316" y="444" fill="#8496A8">],</text>
    <text x="96" y="462" fill="#7FE7D4">"variables"</text><text x="208" y="462" fill="#8496A8">: [</text><text x="224" y="462" fill="#FFC97A">"脫水溫度"</text><text x="292" y="462" fill="#8496A8">, </text><text x="300" y="462" fill="#FFC97A">"相態"</text><text x="344" y="462" fill="#8496A8">],</text>
    <text x="96" y="480" fill="#7FE7D4">"operators"</text><text x="208" y="480" fill="#8496A8">: [</text><text x="224" y="480" fill="#FFC97A">"invert"</text><text x="284" y="480" fill="#8496A8">, </text><text x="292" y="480" fill="#FFC97A">"substitute"</text><text x="376" y="480" fill="#8496A8">],</text>
    <text x="96" y="498" fill="#7FE7D4">"parents"</text><text x="192" y="498" fill="#8496A8">: [</text><text x="208" y="498" fill="#FFC97A">"I2-11"</text><text x="268" y="498" fill="#8496A8">],</text>
    <text x="96" y="516" fill="#7FE7D4">"descriptor"</text><text x="216" y="516" fill="#8496A8">: {</text><text x="232" y="516" fill="#7FE7D4">"scale"</text><text x="292" y="516" fill="#8496A8">: </text><text x="308" y="516" fill="#FFC97A">"元件"</text><text x="348" y="516" fill="#8496A8">, </text><text x="356" y="516" fill="#7FE7D4">"mechanism"</text><text x="452" y="516" fill="#8496A8">: </text><text x="468" y="516" fill="#FFC97A">"相變"</text><text x="508" y="516" fill="#8496A8">, </text><text x="516" y="516" fill="#7FE7D4">"context"</text><text x="596" y="516" fill="#8496A8">: </text><text x="612" y="516" fill="#FFC97A">"建築"</text><text x="652" y="516" fill="#8496A8">},</text>
    <text x="96" y="534" fill="#7FE7D4">"novelty_src"</text><text x="216" y="534" fill="#8496A8">: </text><text x="232" y="534" fill="#FFC97A">"empty-cell"</text><text x="328" y="534" fill="#8496A8">,</text>
    <text x="96" y="552" fill="#7FE7D4">"gate"</text><text x="152" y="552" fill="#8496A8">: {</text><text x="168" y="552" fill="#7FE7D4">"novelty"</text><text x="248" y="552" fill="#8496A8">: </text><text x="264" y="552" fill="#FFC97A">"pass"</text><text x="308" y="552" fill="#8496A8">, </text><text x="316" y="552" fill="#7FE7D4">"critic"</text><text x="384" y="552" fill="#8496A8">: </text><text x="400" y="552" fill="#FFC97A">"2/3"</text><text x="432" y="552" fill="#8496A8">},</text>
    <text x="96" y="570" fill="#7FE7D4">"usefulness"</text><text x="216" y="570" fill="#8496A8">: </text><text x="232" y="570" fill="#FF7A7A">null</text><text x="264" y="570" fill="#8496A8">,</text>
    <text x="96" y="588" fill="#7FE7D4">"status"</text><text x="176" y="588" fill="#8496A8">: </text><text x="192" y="588" fill="#FFC97A">"kept"</text>
    <text x="80" y="606" fill="#5C6E80">}</text>
  </g>
  <text x="700" y="352" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="9" fill="#FF7A7A">usefulness stays null through φ1 —</text>
  <text x="700" y="368" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="9" fill="#FF7A7A">a filled value here voids the round.</text>

  <!-- callouts -->
  <g font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace">
    <rect x="48" y="632" width="340" height="118" rx="8" fill="#101A26" stroke="#22364A"/>
    <text x="64" y="656" font-size="10" fill="#2CE0C2">EVERY IDEA POINTS BACK</text>
    <text x="64" y="676" font-size="9.5" fill="#9FB2C4">elements + variables name the tree it</text>
    <text x="64" y="692" font-size="9.5" fill="#9FB2C4">came from. No element id, no entry.</text>
    <text x="64" y="712" font-size="9.5" fill="#9FB2C4">This is what makes the loop re-runnable:</text>
    <text x="64" y="728" font-size="9.5" fill="#9FB2C4">a reviewer can rebuild the candidate.</text>

    <rect x="404" y="632" width="340" height="118" rx="8" fill="#101A26" stroke="#22364A"/>
    <text x="420" y="656" font-size="10" fill="#2CE0C2">LINEAGE IS NOT DECORATION</text>
    <text x="420" y="676" font-size="9.5" fill="#9FB2C4">parents make duplication checkable across</text>
    <text x="420" y="692" font-size="9.5" fill="#9FB2C4">rounds. A reset individual may carry an</text>
    <text x="420" y="712" font-size="9.5" fill="#9FB2C4">empty parents list — but then novelty_src</text>
    <text x="420" y="728" font-size="9.5" fill="#9FB2C4">must read "reset", never "empty-cell".</text>

    <rect x="760" y="632" width="392" height="118" rx="8" fill="#101A26" stroke="#22364A"/>
    <text x="776" y="656" font-size="10" fill="#2CE0C2">BOTH VERDICTS ARE WRITTEN DOWN</text>
    <text x="776" y="676" font-size="9.5" fill="#9FB2C4">novelty and critic results are stored even</text>
    <text x="776" y="692" font-size="9.5" fill="#9FB2C4">when the candidate is rejected. A rejected</text>
    <text x="776" y="712" font-size="9.5" fill="#9FB2C4">idea is data, not trash — that is why the</text>
    <text x="776" y="728" font-size="9.5" fill="#9FB2C4">archive is never pruned.</text>
  </g>

  <text x="48" y="790" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="10.5" fill="#FFC97A">Honest limit: the novelty verdict is an LLM heuristic [代理], not a distance metric. Two candidates the model calls different may be the same</text>
  <text x="48" y="808" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="10.5" fill="#FFC97A">idea wearing different words. The descriptor grid is the mechanical backstop against exactly that failure — it is coarser, and it is honest.</text>
  <text x="48" y="840" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="10" fill="#5C6E80">All twelve fields are asserted by script before an append is allowed. A malformed trace is rejected at write time, not audited later.</text>
</svg>
