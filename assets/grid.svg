<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Descriptor grid archive with occupancy">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080C12"/>
      <stop offset="1" stop-color="#0A1119"/>
    </linearGradient>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FFB454"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="url(#bgD)"/>

  <text x="48" y="52" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="20" font-weight="700" fill="#E8F0F7">THE ARCHIVE — descriptor grid</text>
  <text x="48" y="76" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="11.5" fill="#8496A8">Coordinates are (scale, mechanism, context). Occupancy is the only novelty signal the gate is allowed to read.</text>

  <!-- context chips -->
  <g font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace">
    <text x="150" y="122" font-size="10" fill="#8496A8">CONTEXT · 建築</text>
    <rect x="248" y="110" width="70" height="20" rx="4" fill="#0E1A26" stroke="#24404F"/>
    <text x="258" y="124" font-size="9" fill="#7FE7D4">製造</text>
    <rect x="326" y="110" width="70" height="20" rx="4" fill="#0E1A26" stroke="#24404F"/>
    <text x="336" y="124" font-size="9" fill="#7FE7D4">醫療</text>
    <rect x="404" y="110" width="70" height="20" rx="4" fill="#0E1A26" stroke="#24404F"/>
    <text x="414" y="124" font-size="9" fill="#7FE7D4">能源</text>
    <text x="150" y="166" font-size="10" fill="#5AA9FF" letter-spacing="1.4">SCALE · 尺度 →</text>
  </g>

  <!-- grid -->
  <g font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace">
    <!-- occupied cells -->
    <rect x="150" y="210" width="116" height="72" rx="6" fill="#0F2230" stroke="#2CE0C2"/>
    <text x="162" y="234" font-size="9" fill="#2CE0C2">I1-02</text>
    <text x="162" y="256" font-size="9.5" fill="#C6D4E1">相變外殼</text>
    <text x="162" y="272" font-size="8.5" fill="#6F8296">元件 / 相變</text>

    <rect x="278" y="210" width="116" height="72" rx="6" fill="#0F2230" stroke="#2CE0C2"/>
    <text x="290" y="234" font-size="9" fill="#2CE0C2">I1-05</text>
    <text x="290" y="256" font-size="9.5" fill="#C6D4E1">被動調溫</text>
    <text x="290" y="272" font-size="8.5" fill="#6F8296">系統 / 相變</text>

    <rect x="406" y="210" width="116" height="72" rx="6" fill="#0F2230" stroke="#2CE0C2"/>
    <text x="418" y="234" font-size="9" fill="#2CE0C2">I2-11</text>
    <text x="418" y="256" font-size="9.5" fill="#C6D4E1">脫水觸發</text>
    <text x="418" y="272" font-size="8.5" fill="#6F8296">元件 / 化學</text>

    <rect x="278" y="290" width="116" height="72" rx="6" fill="#0F2230" stroke="#2CE0C2"/>
    <text x="290" y="314" font-size="9" fill="#2CE0C2">I2-19</text>
    <text x="290" y="336" font-size="9.5" fill="#C6D4E1">鹽水封裝</text>
    <text x="290" y="352" font-size="8.5" fill="#6F8296">系統 / 化學</text>

    <rect x="534" y="370" width="116" height="72" rx="6" fill="#0F2230" stroke="#2CE0C2"/>
    <text x="546" y="394" font-size="9" fill="#2CE0C2">I3-04</text>
    <text x="546" y="416" font-size="9.5" fill="#C6D4E1">溫度當觸發器</text>
    <text x="546" y="432" font-size="8.5" fill="#6F8296">元件 / 相變</text>

    <rect x="662" y="290" width="116" height="72" rx="6" fill="#0F2230" stroke="#2CE0C2"/>
    <text x="674" y="314" font-size="9" fill="#2CE0C2">I3-07</text>
    <text x="674" y="336" font-size="9.5" fill="#C6D4E1">濕度反向</text>
    <text x="674" y="352" font-size="8.5" fill="#6F8296">材料 / 化學</text>

    <!-- empty cells -->
    <g fill="#0B141C" stroke="#233447" stroke-dasharray="4 4">
      <rect x="406" y="290" width="116" height="72" rx="6"/>
      <rect x="150" y="290" width="116" height="72" rx="6"/>
      <rect x="150" y="370" width="116" height="72" rx="6"/>
      <rect x="278" y="370" width="116" height="72" rx="6"/>
      <rect x="406" y="370" width="116" height="72" rx="6"/>
      <rect x="534" y="210" width="116" height="72" rx="6"/>
      <rect x="534" y="290" width="116" height="72" rx="6"/>
      <rect x="662" y="210" width="116" height="72" rx="6"/>
      <rect x="662" y="370" width="116" height="72" rx="6"/>
      <rect x="150" y="450" width="116" height="72" rx="6"/>
      <rect x="278" y="450" width="116" height="72" rx="6"/>
      <rect x="406" y="450" width="116" height="72" rx="6"/>
      <rect x="534" y="450" width="116" height="72" rx="6"/>
      <rect x="662" y="450" width="116" height="72" rx="6"/>
    </g>
    <g fill="#3B4C5E" font-size="14">
      <text x="456" y="332" text-anchor="middle">+</text>
      <text x="200" y="332" text-anchor="middle">+</text>
      <text x="200" y="412" text-anchor="middle">+</text>
      <text x="328" y="412" text-anchor="middle">+</text>
      <text x="456" y="412" text-anchor="middle">+</text>
      <text x="584" y="252" text-anchor="middle">+</text>
      <text x="584" y="332" text-anchor="middle">+</text>
      <text x="712" y="252" text-anchor="middle">+</text>
      <text x="712" y="412" text-anchor="middle">+</text>
      <text x="200" y="492" text-anchor="middle">+</text>
      <text x="328" y="492" text-anchor="middle">+</text>
      <text x="456" y="492" text-anchor="middle">+</text>
      <text x="584" y="492" text-anchor="middle">+</text>
      <text x="712" y="492" text-anchor="middle">+</text>
    </g>

    <!-- targets -->
    <rect x="406" y="450" width="116" height="72" rx="6" fill="#1A1508" stroke="#FFB454" stroke-width="1.5"/>
    <text x="418" y="474" font-size="9" fill="#FFB454">TARGET</text>
    <text x="418" y="494" font-size="9.5" fill="#FFD9A0">未佔用</text>
    <text x="418" y="510" font-size="8.5" fill="#8A7A55">下一輪優先</text>
    <path d="M 464 522 V 546 H 596 V 446" fill="none" stroke="#FFB454" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrT)"/>
    <text x="470" y="562" font-size="8.5" fill="#FFB454">empty-cell pressure</text>
  </g>

  <!-- axis label -->
  <text transform="translate(96,420) rotate(-90)" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="10" fill="#5AA9FF" letter-spacing="1.4">MECHANISM · 機制 →</text>

  <!-- right panel -->
  <rect x="820" y="200" width="316" height="322" rx="10" fill="#0C141E" stroke="#1B2A3B"/>
  <text x="838" y="228" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="11" fill="#2CE0C2" letter-spacing="1.6">WHAT THE GATE MAY READ</text>
  <g font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="10" fill="#9FB2C4">
    <text x="838" y="254">occupied = a row exists in grid.md</text>
    <text x="838" y="278">empty = an allowed novelty target</text>
    <text x="838" y="302">same cell twice = a duplicate, counted</text>
    <text x="838" y="326">cluster identity = shared par + ops</text>
    <text x="838" y="356" fill="#FFC97A">Occupancy is computed by script set-</text>
    <text x="838" y="372" fill="#FFC97A">operations. Never by reading prose.</text>
    <text x="838" y="404" fill="#8496A8">grid.md is the only state the model</text>
    <text x="838" y="420" fill="#8496A8">sees between rounds. ideas.jsonl</text>
    <text x="838" y="436" fill="#8496A8">stays closed unless a check needs it.</text>
    <text x="838" y="468" fill="#7FE7D4">Rows carry par + ops precisely so a</text>
    <text x="838" y="484" fill="#7FE7D4">later round can detect the same idea</text>
    <text x="838" y="500" fill="#7FE7D4">arriving under a new name.</text>
  </g>

  <!-- bottom note -->
  <rect x="48" y="576" width="1104" height="132" rx="10" fill="#0B1620" stroke="#1E3A4A"/>
  <text x="64" y="602" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="11" fill="#5AA9FF" letter-spacing="1.6">WHY A GRID AND NOT A VECTOR SPACE</text>
  <g font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="10" fill="#9FB2C4">
    <text x="64" y="628">An embedding distance would need a model, a threshold and a tunable — three more things that can lie quietly. A discrete grid</text>
    <text x="64" y="646">is checkable with set operations and a diff. It is coarser than a real distance metric; that coarseness is the price of auditability.</text>
    <text x="64" y="670" fill="#FFC97A">Known cost: two ideas that differ only in nuance land in the same cell and are counted as one. This biases the loop toward</text>
    <text x="64" y="688" fill="#FFC97A">breadth over depth — a deliberate trade, and the reason φ3 exists.</text>
  </g>
</svg>
