<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-label="Four gates, three phases, stop rules">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080C12"/>
      <stop offset="1" stop-color="#0A1119"/>
    </linearGradient>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B08CFF"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FFB454"/>
    </marker>
  </defs>
  <rect width="1200" height="880" fill="url(#bgG)"/>

  <text x="48" y="52" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="20" font-weight="700" fill="#E8F0F7">FOUR GATES · THREE PHASES · STOP RULES</text>
  <text x="48" y="76" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="11.5" fill="#8496A8">The gates exist to prevent premature convergence. They are structural, not advisory — a round that breaks one is void.</text>

  <g font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace">
    <rect x="64" y="104" width="250" height="158" rx="8" fill="#101A26" stroke="#2CE0C2"/>
    <text x="80" y="128" font-size="10" fill="#2CE0C2" letter-spacing="1.6">GATE 1</text>
    <text x="80" y="150" font-size="12.5" font-weight="700" fill="#E8F0F7">ARCHIVE NEVER PRUNES</text>
    <text x="80" y="174" font-size="10" fill="#9FB2C4">Deprecated is a label, not a</text>
    <text x="80" y="190" font-size="10" fill="#9FB2C4">deletion. Any round that</text>
    <text x="80" y="206" font-size="10" fill="#9FB2C4">removes a row is void.</text>
    <rect x="80" y="228" width="66" height="22" rx="4" fill="#12202C" stroke="#24404F"/>
    <text x="90" y="243" font-size="9" fill="#7FE7D4">[rule]</text>

    <rect x="332" y="104" width="250" height="158" rx="8" fill="#101A26" stroke="#FFB454"/>
    <text x="348" y="128" font-size="10" fill="#FFB454" letter-spacing="1.6">GATE 2</text>
    <text x="348" y="150" font-size="12.5" font-weight="700" fill="#E8F0F7">ROUNDS 1–2 PURE NOVELTY</text>
    <text x="348" y="174" font-size="10" fill="#9FB2C4">No usefulness score before</text>
    <text x="348" y="190" font-size="10" fill="#9FB2C4">round 3. Early usefulness is</text>
    <text x="348" y="206" font-size="10" fill="#9FB2C4">the deceptive objective.</text>
    <rect x="348" y="228" width="66" height="22" rx="4" fill="#12202C" stroke="#24404F"/>
    <text x="358" y="243" font-size="9" fill="#7FE7D4">[rule]</text>

    <rect x="600" y="104" width="250" height="158" rx="8" fill="#101A26" stroke="#FFB454"/>
    <text x="616" y="128" font-size="10" fill="#FFB454" letter-spacing="1.6">GATE 3</text>
    <text x="616" y="150" font-size="12.5" font-weight="700" fill="#E8F0F7">MUTATION TIERS 5:3:2</text>
    <text x="616" y="174" font-size="10" fill="#9FB2C4">Tiers counted from the</text>
    <text x="616" y="190" font-size="10" fill="#9FB2C4">operator list. Drift must be</text>
    <text x="616" y="206" font-size="10" fill="#9FB2C4">printed in the run log.</text>
    <rect x="616" y="228" width="42" height="22" rx="4" fill="#2A2114" stroke="#5A4520"/>
    <text x="626" y="243" font-size="9" fill="#FFC97A">[H]</text>

    <rect x="868" y="104" width="250" height="158" rx="8" fill="#101A26" stroke="#2CE0C2"/>
    <text x="884" y="128" font-size="10" fill="#2CE0C2" letter-spacing="1.6">GATE 4</text>
    <text x="884" y="150" font-size="12.5" font-weight="700" fill="#E8F0F7">RESET ×1 PER ROUND</text>
    <text x="884" y="174" font-size="10" fill="#9FB2C4">Exactly one candidate from</text>
    <text x="884" y="190" font-size="10" fill="#9FB2C4">elements that never co-</text>
    <text x="884" y="206" font-size="10" fill="#9FB2C4">occurred. Two breaks it.</text>
    <rect x="884" y="228" width="66" height="22" rx="4" fill="#12202C" stroke="#24404F"/>
    <text x="894" y="243" font-size="9" fill="#7FE7D4">[rule]</text>
  </g>

  <!-- phase machine -->
  <rect x="48" y="292" width="1104" height="252" rx="10" fill="#0C141E" stroke="#1B2A3B"/>
  <text x="64" y="318" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="11" fill="#B08CFF" letter-spacing="2">PHASE STATE MACHINE · φ1 → φ2 → φ3</text>

  <g font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace">
    <rect x="64" y="338" width="250" height="128" rx="8" fill="#101A26" stroke="#22364A"/>
    <text x="80" y="362" font-size="12.5" font-weight="700" fill="#E8F0F7">φ1 · EXPLORE</text>
    <text x="80" y="386" font-size="10" fill="#9FB2C4">Pure novelty. Usefulness is</text>
    <text x="80" y="402" font-size="10" fill="#9FB2C4">not scored at all.</text>
    <text x="80" y="424" font-size="10" fill="#8FA2B4">exit: duplication ≥50% in one</text>
    <text x="80" y="440" font-size="10" fill="#8FA2B4">round, or round ≥ 3</text>

    <rect x="390" y="338" width="250" height="128" rx="8" fill="#101A26" stroke="#22364A"/>
    <text x="406" y="362" font-size="12.5" font-weight="700" fill="#E8F0F7">φ2 · BALANCED</text>
    <text x="406" y="386" font-size="10" fill="#9FB2C4">Novelty + feasibility. This is</text>
    <text x="406" y="402" font-size="10" fill="#9FB2C4">where usefulness first enters.</text>
    <text x="406" y="424" font-size="10" fill="#8FA2B4">exit: 2 consecutive rounds</text>
    <text x="406" y="440" font-size="10" fill="#8FA2B4">with zero new cell</text>

    <rect x="716" y="338" width="250" height="128" rx="8" fill="#101A26" stroke="#22364A"/>
    <text x="732" y="362" font-size="12.5" font-weight="700" fill="#E8F0F7">φ3 · EXPLOIT</text>
    <text x="732" y="386" font-size="10" fill="#9FB2C4">Deepen the strongest lineage,</text>
    <text x="732" y="402" font-size="10" fill="#9FB2C4">but new cells are still required.</text>
    <text x="732" y="424" font-size="10" fill="#8FA2B4">a breakthrough is recorded,</text>
    <text x="732" y="440" font-size="10" fill="#8FA2B4">then φ1 re-opens</text>
  </g>

  <path d="M 314 402 H 386" fill="none" stroke="#B08CFF" stroke-width="1.6" marker-end="url(#arrP)"/>
  <text x="320" y="394" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="8.5" fill="#9B8FD0">≥50% dup</text>
  <path d="M 640 402 H 712" fill="none" stroke="#B08CFF" stroke-width="1.6" marker-end="url(#arrP)"/>
  <text x="646" y="394" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="8.5" fill="#9B8FD0">2× zero new</text>

  <path d="M 841 466 V 492 H 189 V 470" fill="none" stroke="#FFB454" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="420" y="486" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="9" fill="#FFB454">breakthrough → record it, then re-open φ1</text>

  <!-- stop rules -->
  <rect x="48" y="564" width="1104" height="150" rx="10" fill="#0B1620" stroke="#3A2A1A"/>
  <text x="64" y="590" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="11" fill="#FFB454" letter-spacing="2">STOP RULES · checked before the loop may halt</text>
  <g font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="10" fill="#9FB2C4">
    <text x="64" y="616">1 · 2 consecutive rounds with zero new cell AND a control round with no breakthrough</text>
    <text x="64" y="636">2 · user stop — explicit, logged, archive untouched</text>
    <text x="64" y="656">3 · round cap reached (default 8, [H])</text>
    <text x="64" y="684" fill="#FFC97A">The control round disables usefulness scoring and runs novelty only. ≥2 new cells there means the stop</text>
    <text x="64" y="700" fill="#FFC97A">criterion was deceptive — the loop returns to φ1 instead of halting.</text>
  </g>

  <rect x="48" y="732" width="1104" height="112" rx="10" fill="#0A1018" stroke="#1A2734"/>
  <text x="64" y="758" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="11" fill="#8496A8" letter-spacing="1.4">HOW THESE NUMBERS MAY CHANGE</text>
  <text x="64" y="782" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="10" fill="#9FB2C4">Every threshold on this page is a hypothesis, not a measurement. A parameter may only move one at a time, with a</text>
  <text x="64" y="798" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="10" fill="#9FB2C4">logged parameter version and a stated reason. The archive is never part of the trade — it survives every tuning.</text>
  <text x="64" y="826" font-family="Menlo, Consolas, 'Noto Sans CJK TC', monospace" font-size="10" fill="#5C6E80">Structural rules (G1, G2, G4) are not tunable. G3's ratio is an [H] hypothesis: one parameter per change, versioned in the run log (F1: 5:3:2 → 3:4:3).</text>
</svg>
